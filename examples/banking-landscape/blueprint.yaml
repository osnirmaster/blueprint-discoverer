# Blueprint Discoverer project file: which repositories make up the as-is landscape.
name: digital-banking-as-is
repositories:
  - { name: accounts-service, path: accounts-service }
  - { name: payments-service, path: payments-service }
  - { name: fraud-detection, path: fraud-detection }
  - { name: customer-service, path: customer-service }
  - { name: digital-banking-bff, path: digital-banking-bff }
  # remote repositories are shallow-cloned into .blueprint/repos/
  # - { name: core-banking, url: https://github.com/acme/core-banking.git, ref: main }
inference:
  min_domain_score: 0.15
  llm:
    enabled: false          # set true + ANTHROPIC_API_KEY to enrich with Claude
    model: claude-opus-5-5
    effort: medium
# Human decisions always win over inference (method = "human", confidence = 1.0).
overrides:
  classifications: {}
  #  customer-service: party-lifecycle-management
