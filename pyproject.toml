[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "blueprint-discoverer"
version = "0.1.0"
description = "As-is architecture mapper: scans repositories, infers banking semantics (BIAN) and emits FINOS CALM architecture-as-code, a graph (LadybugDB) and a living wiki."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Osnir Teixeira Costa" }]
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-java>=0.23",
  "tree-sitter-typescript>=0.23",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pydantic>=2.8",
  "typer>=0.12",
  "ladybug>=0.22",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
blueprint = "blueprint_discoverer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint_discoverer"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "blueprint_discoverer/_schemas"
"RULES.md" = "blueprint_discoverer/_rules/RULES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "PLW1510"]
ignore = ["B008", "E501", "E741", "UP042"]  # B008: typer options as defaults; UP042: str+Enum keeps pydantic JSON simple
